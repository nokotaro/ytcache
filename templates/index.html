<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Cache</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main>
    <h1>YouTube → VRChat キャッシュ</h1>
    <p class="hint">YouTube動画URLを入力すると、互換性重視のMP4を作成してR2へ保存します。</p>
    <form id="cache-form">
      <label for="url">YouTube URL</label>
      <input id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." required autofocus>
      <button id="submit" type="submit">キャッシュ実行</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" hidden>
      <h2>再生用URL</h2>
      <code id="result-url"></code>
      <button id="copy" type="button">コピー</button>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
